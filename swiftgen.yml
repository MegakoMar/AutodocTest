input_dir: AutodocTest/Resources
output_dir: AutodocTest/Generated
plist:
    inputs: Info.plist
    outputs:
        templateName: runtime-swift5
        output: Plist.swift
xcassets:
    inputs: Assets.xcassets
    outputs:
        templateName: swift5
        output: Assets.swift
        params:
            enumName: Assets
strings:
    inputs:
        - Localizable/ru.lproj/Localizable.strings
    outputs:
        templateName: structured-swift5
        output: Strings.swift
